name: ARM duration check

on:
  push:
    branches: [arm-duration-check]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and install
        run: |
          python -m pip install --upgrade pip pytest build
          python -m build
          pip install dist/*.whl
      - name: Show platform
        run: python -c "import platform, numpy as np; print(platform.machine(), np.__version__); print(np.array([np.inf, -np.inf, np.nan]).astype('timedelta64[ms]'))"
      - name: Run duration tests without the fix
        run: pytest tests/test_duration.py -v
